name: tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install (CPU, runtime deps only)
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest -q
      - name: Validate configs parse
        run: |
          python -c "import yaml,glob; [yaml.safe_load(open(p)) for p in glob.glob('configs/*.yaml')]; print('configs OK')"
